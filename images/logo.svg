<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <!-- Neural Network / Circuit Shield Icon -->
  <g transform="translate(5, 5)">
    <!-- Hexagonal Outer Shield -->
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#1e56d6" opacity="0.2"/>
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#1e56d6" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Network Node Connections -->
    <line x1="20" y1="9" x2="11" y2="24" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="20" y1="9" x2="29" y2="24" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="11" y1="24" x2="29" y2="24" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="20" y1="9" x2="20" y2="31" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Nodes -->
    <circle cx="20" cy="9" r="3.5" fill="#ffffff"/>
    <circle cx="11" cy="24" r="3" fill="#1e56d6" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="29" cy="24" r="3" fill="#1e56d6" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="20" cy="31" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="52" y="25" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="17" fill="#ffffff" letter-spacing="1">AI SOCIETY</text>
  <text x="52" y="38" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="9.5" fill="#a0c4ff" letter-spacing="0.5">UNIVERSITY CHAPTER</text>
</svg>